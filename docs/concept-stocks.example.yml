# ============================================================================
# 纯概念股市场配置示例（仅虚拟证券，无任何实物物品）
#
# 使用方法：
#   1. 把下方 markets: 段替换服务器上 qssuite-exchange 数据目录里的
#      markets.yml 对应内容（或把需要的条目合并进去）。
#   2. 先用 enabled: false 启动一次服务器，让市场和证券行写入数据库。
#   3. 把 enabled 改为 true 并重启；若市场状态不是 OPEN，
#      先执行 /qse admin market resume <市场ID> <原因>。
#   4. 逐个恢复证券（CLOSED -> OPEN）：
#        /qse admin stock resume ALPHA 上线
#        /qse admin stock resume BETA 上线
#        /qse admin stock resume GAMMA 上线
#        /qse admin stock resume DELTA 上线
#        /qse admin stock resume EPSLN 上线
#        /qse admin stock resume ZETA 上线
#        /qse admin stock resume ETA 上线
#        /qse admin stock resume THETA 上线
#        /qse admin stock resume IOTA 上线
#        /qse admin stock resume KAPPA 上线
#        /qse admin stock resume LAMBDA 上线
#        /qse admin stock resume OMEGA 上线
#        /qse admin stock resume PIXEL 上线
#        /qse admin stock resume NOVA 上线
#        /qse admin stock resume MOON 上线
#   5. 用 /qse admin stock issue <市场ID|代码> <玩家UUID> <数量> <原因>
#      发行初始供应量，玩家才真正持有可交易的股票。
#
# 设计说明：15 只股票覆盖不同"行业"与风险档位——
#   大盘稳健：ALPHA / DELTA / PIXEL / IOTA / GAMMA
#   成长中盘：BETA / NOVA / THETA / ZETA / KAPPA
#   稀缺高价：ETA / LAMBDA / OMEGA / EPSLN
#   高波动主题：MOON（Meme 币，仅供娱乐）
# ============================================================================
